name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    uses: ./.github/workflows/typecheck.yml

  build:
    uses: ./.github/workflows/build.yml

  container:
    uses: ./.github/workflows/container.yml

  deploy:
    name: Deploy to Fly.io
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [typecheck, build, container]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate deployment configuration
        run: |
          if [ -z "$FLY_APP_NAME" ]; then
            echo "Missing GitHub Actions variable: FLY_APP_NAME"
            exit 1
          fi
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret: FLY_API_TOKEN"
            exit 1
          fi
          flyctl config validate --app "$FLY_APP_NAME" --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ vars.FLY_APP_NAME }}

      - name: Deploy
        run: flyctl deploy --remote-only --app "$FLY_APP_NAME" --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ vars.FLY_APP_NAME }}

      - name: Show Fly diagnostics after a failed deploy
        if: failure()
        continue-on-error: true
        run: |
          flyctl status --app "$FLY_APP_NAME"
          flyctl releases --app "$FLY_APP_NAME"
          flyctl logs --app "$FLY_APP_NAME" --no-tail
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ vars.FLY_APP_NAME }}
