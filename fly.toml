primary_region = "sin"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  CLIENT_URL = "https://achievable-todo.vercel.app"
  REDIS_KEY_PREFIX = "achievable"
  SALT_ROUNDS = "10"
  ACCESS_TOKEN_TTL_SECONDS = "600"
  REFRESH_TOKEN_TTL_SECONDS = "604800"
  ACCESS_TOKEN_ISSUER = "achievable-api"
  ACCESS_TOKEN_AUDIENCE = "achievable-api"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 75

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
